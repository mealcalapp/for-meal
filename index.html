<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Meal Register App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="./flip.css">
    <link rel="stylesheet" href="./meal.css">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #floatingButton {
            z-index: 100;
            border-radius: 9999px;
            color: #ffffff;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 45%, #06b6d4 100%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 14px 28px rgba(30, 58, 138, 0.35), 0 8px 16px rgba(2, 6, 23, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }

        #floatingButton:hover {
            transform: translateY(-2px) scale(1.03);
            filter: saturate(1.15);
            box-shadow: 0 18px 30px rgba(30, 58, 138, 0.4), 0 10px 20px rgba(2, 6, 23, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
    </style>
    <!-- Custom configuration for Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary-blue': '#3B82F6',
                        'light-gray': '#F9FAFB',
                        'border-subtle': '#E5E7EB',
                    }
                }
            }
        }
    </script>
    
</head>
<body class="p-4 md:p-8">

    <!-- Header Section -->
    <header class="premium-header mb-6 md:mb-8 text-center p-5 md:p-6 rounded-2xl">
        <div class="premium-header-content">
        <h1 id="month-header" class="text-3xl md:text-4xl font-extrabold text-white tracking-tight drop-shadow-sm">
            <!-- Dynamic Month and Year will be injected here -->
        </h1>
        <p class="text-sm text-blue-100 mt-1">Real-time monthly Meal Register</p>
        
        <div class="header-glass-panel mt-4">
            <div class="flex flex-wrap justify-center items-center gap-3">
                <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">

                    <div style="display:flex; align-items:center; gap:10px;">
                        <label for="manager-name-input" class="header-label">Manager Name</label>
                        <input
                            type="text"
                            id="manager-name-input"
                            class="header-control w-28 p-1.5 text-sm"
                            placeholder="Manager"
                        >
                    </div>

                    <div id="manager-only-history" style="display:flex; align-items:center; gap:10px;">
                        <label for="month-selector" class="header-label">History</label>
                        <select
                            id="month-selector"
                            class="header-control p-1"
                        ></select>
                    </div>

                    <div style="display:flex; align-items:center; gap:10px;">
                        <label for="fixed-meal-input" class="header-label">Fixed Meal</label>
                        <input
                            type="number"
                            id="fixed-meal-input"
                            class="header-control w-11 p-1.5 text-center"
                            min="0"
                            value="60"
                        >
                    </div>
                    <div id="manager-only-total-members" class="manager-only-control hidden flex items-center gap-2">
                    <label for="total-members-input" class="header-label">Members</label>
                    <input
                        type="number"
                        id="total-members-input"
                        class="header-control w-11 p-2 text-center"
                        min="1"
                        max="999"
                        value="20"
                    >
                </div>

                </div>
                <button id="fixed-meal-save-btn" class="px-3 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-lg shadow-indigo-900/30">Set</button>
            </div>
        </div>

        <div class="mt-3 flex flex-wrap justify-center items-center gap-2">
            <span id="manager-mode-indicator" class="header-chip text-sm"></span>
            <button id="bazar-toggle-btn" class="bazar-toggle-btn px-3 py-2 text-sm font-semibold text-white rounded-lg hover:bg-white/25">Bazar Cost</button>
            <button id="note-toggle-btn" class="note-toggle-btn px-3 py-2 text-sm font-semibold text-white rounded-lg hover:bg-white/25">Additional Cost</button>
            <button id="manager-login-btn" class="px-3 py-2 text-sm font-semibold text-white bg-slate-900/75 border border-white/30 rounded-lg hover:bg-slate-900">Manager Login</button>
            <button id="manager-logout-btn" class="px-3 py-2 text-sm font-semibold text-white bg-rose-600 rounded-lg hover:bg-rose-700 hidden">Manager Logout</button>
        </div>
        <div id="manager-login-panel" class="mt-3 flex flex-wrap justify-center items-center gap-2 hidden">
            <input type="password" id="manager-password" class="header-control w-40 p-2 text-sm" placeholder="Manager password">
            <button id="manager-submit-btn" class="px-3 py-2 text-sm font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700">Login</button>
        </div>
        </div>
    </header>
    
    <div id="message-box-container" class="relative w-full mb-4">
        <div id="message-box" class="mx-auto w-full md:w-1/2 bg-green-500 text-white p-3 rounded-lg shadow-xl text-center hidden transition-all duration-300 transform opacity-0">
            Saved!
        </div>
    </div>


    <!-- Table Container -->
    <div id="table-container" class="w-full">
        <table id="meal-register-table" class="min-w-full border-collapse border border-border-subtle text-sm">
            <!-- Table content will be generated by JavaScript -->
        </table>
    </div>
    <section id="bazar-panel" class="bazar-panel">
        <div class="bazar-toolbar">
            <div>
                <div class="bazar-title">Bazar Cost</div>
                <div class="bazar-hint">Only Manager can edit</div>
            </div>
        </div>
        <textarea id="bazar-editor" class="bazar-editor" placeholder="Write bazar cost here..."></textarea>
    </section>
    <section id="notes-panel" class="notes-panel">
        <div class="notes-toolbar">
            <div>
                <div class="notes-title">Additional Costs</div>
                <div class="notes-hint">Only Manager can edit</div>
            </div>
        </div>
        <textarea id="notes-editor" class="notes-editor" placeholder="Write notes here..."></textarea>
    </section>
  <div class="notice-box mb-2">
    <marquee id="monthMarquee" style="color: #699ef5;padding: 5px;border-radius: 5px;border:1px solid #699ef5;margin-top: 5px;" behavior="scroll"><!-- Text will appear here --></marquee>
  </div>
  <div class="text-center">
      <div id="flipdownTimer" class="flipdown d-inline-block"></div>
  </div>

<!-- Floating Button -->
    <button id="floatingButton"
        class="fixed bottom-10 right-4 px-3 py-2 font-semibold flex items-center space-x-2 shadow-2xl">
        <i class="fas fa-calculator text-lg"></i>
        <span class="hidden md:inline">Meal Calculator</span>
    </button>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="./meal.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mealcalapp/for-all/flip.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <div style="text-align:center; margin-top:20px; font-size:13px; color:#555;">
    <span style="font-size:18px; vertical-align:middle;">&copy;</span>
    <a href="https://saniatkajoljisan.github.io/skjisan/" target="_blank" style="color:#3182ce; font-weight:bold; text-decoration:none; margin:0 1px; vertical-align:middle;">SK JISAN</a>
    <span id="currentYear" style="vertical-align:middle;"></span>
    </div>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>

</body>
</html>
